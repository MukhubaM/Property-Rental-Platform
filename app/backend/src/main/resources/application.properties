spring.application.name=platform

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/property_rental}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# Do not automatically modify the database schema.
# Flyway migrations will manage schema changes.
spring.jpa.hibernate.ddl-auto=validate

# Display SQL queries during local development.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Use PostgreSQL as the database dialect.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# FLYWAY DATABASE MIGRATIONS
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.serialization.write-dates-as-timestamps=false

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
