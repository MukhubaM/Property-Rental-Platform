
name: PR Title Validation

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  validate-title:
    name: Validate PR title
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title convention
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          TITLE="$(echo "$PR_TITLE" | sed 's/[[:space:]]*$//')"

          if [[ "$TITLE" =~ ^(feature|bugfix|hotfix|refactor|docs|test):[[:space:]]+.+$ ]]; then
            echo "PR title is valid: $TITLE"
          else
            echo "::error::Invalid PR title: $TITLE"
            echo "Expected format: type: Description"
            echo "Example: feature: Add GET endpoint to retrieve all roles"
            exit 1
          fi
